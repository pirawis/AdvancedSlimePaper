name: Build Plugin

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/release/1.21.4' }}
          cache-cleanup: on-success

      - name: Build Plugin
        run: ./gradlew :plugin:build --parallel --build-cache --no-watch-fs -x test -x javadoc
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=true"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: asp-plugin-build-${{ github.run_number }}
          path: |
            plugin/build/libs/asp-plugin-*.jar
            !plugin/build/libs/*-javadoc*.jar
            !plugin/build/libs/*-sources*.jar
          if-no-files-found: error

  dev-release:
    needs: build
    if: github.ref == 'refs/heads/release/1.21.4' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: asp-plugin-build-${{ github.run_number }}
          path: release-files

      - name: Delete old dev release
        run: gh release delete dev-builds --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-builds
          name: "Development Build ${{ github.run_number }}"
          body: |
            ## Plugin Development Build ${{ github.run_number }}

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ⚠️ This is a development build and may be unstable.

            For full server builds, check [Releases](https://github.com/${{ github.repository }}/releases).
          files: release-files/*.jar
          prerelease: true
          make_latest: false

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const cachesToDelete = caches.data.actions_caches
              .sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at))
              .slice(5);

            for (const cache of cachesToDelete) {
              console.log(`Deleting cache: ${cache.key}`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
