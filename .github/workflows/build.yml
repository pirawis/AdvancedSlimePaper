name: Build

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/**'

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/release/1.21.4' }}
          cache-cleanup: on-success

      - name: Configure Git
        run: |
          git config --global user.name "SurvivorsDev"
          git config --global user.email "pm@survivorsdev.com"

      - name: Apply Patches & Build
        run: |
          ./gradlew applyAllPatches --parallel --build-cache
          ./gradlew assemble createMojmapPaperclipJar --parallel --build-cache -x test -x javadoc
        env:
          GRADLE_OPTS: "-Xmx6g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=true -Dorg.gradle.workers.max=4 -Dkotlin.incremental=true"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: asp-plugin-build-${{ github.run_number }}
          path: plugin/build/libs/asp-plugin-*.jar
          if-no-files-found: ignore

      - name: Upload Paperclip JAR
        uses: actions/upload-artifact@v4
        with:
          name: aspaper-paperclip-build-${{ github.run_number }}
          path: aspaper-server/build/libs/*-paperclip-*.jar
          if-no-files-found: ignore

      - name: Upload Bundler JAR
        uses: actions/upload-artifact@v4
        with:
          name: aspaper-bundler-build-${{ github.run_number }}
          path: aspaper-server/build/libs/*-bundler-*.jar
          if-no-files-found: ignore

  # Cleanup old caches
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const cachesToDelete = caches.data.actions_caches
              .sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at))
              .slice(5); // Keep only 5 most recent

            for (const cache of cachesToDelete) {
              console.log(`Deleting cache: ${cache.key}`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }

  # Development builds - her commit'te
  dev-release:
    needs: build
    if: github.ref == 'refs/heads/release/1.21.4' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts with build number
        run: |
          mkdir -p release-files
          find artifacts -name "*.jar" -exec cp {} release-files/ \;
          cd release-files
          for file in *.jar; do
            if [[ -f "$file" ]]; then
              name="${file%.jar}"
              mv "$file" "${name}-build-${{ github.run_number }}.jar"
            fi
          done

      - name: Delete old dev release
        run: gh release delete dev-builds --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-builds
          name: "Development Builds"
          body: |
            ## Development Build ${{ github.run_number }}

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ⚠️ This is a development build and may be unstable.

            For stable releases, check the [Releases](https://github.com/${{ github.repository }}/releases) page.
          files: release-files/*.jar
          prerelease: true
          make_latest: false

  # Stabil release - manuel tag ile (v1.21.4-R1 formatında)
  stable-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.jar" -exec cp {} release-files/ \;

      - name: Create Stable Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
