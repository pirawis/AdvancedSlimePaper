name: Build

on:
  push:
    branches:
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/release/1.21.4' }}

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: asp-plugin
          path: plugin/build/libs/asp-plugin*.jar
          if-no-files-found: warn

      - name: Upload Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: aspaper-server
          path: aspaper-server/build/libs/aspaper-bundler-*-mojmap.jar
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'SNAPSHOT') }}
