name: Coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    name: Generate coverage report
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests with coverage
        run: |
          ./gradlew aggregateCoverageReport --continue

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          codecov_yml_path: codecov.yml
          directory: .
          disable_search: true
          fail_ci_if_error: true
          files: build/reports/jacoco/aggregateCoverageReport/aggregateCoverageReport.xml
          flags: unittests
          name: github-actions
          override_branch: ${{ github.ref_name }}
          override_build: ${{ github.run_id }}
          override_build_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          override_commit: ${{ github.sha }}
          slug: pirawis/AdvancedSlimePaper
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
