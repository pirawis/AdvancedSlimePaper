name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Configure Git
        run: |
          git config --global user.name "SurvivorsDev"
          git config --global user.email "pm@survivorsdev.com"

      - name: Apply Patches & Build
        run: |
          ./gradlew applyAllPatches --parallel --build-cache --no-watch-fs
          ./gradlew assemble createMojmapPaperclipJar --parallel --build-cache --no-watch-fs -x test -x javadoc
        env:
          GRADLE_OPTS: "-Xmx6g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=true -Dorg.gradle.workers.max=4 -Dkotlin.incremental=true"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: asp-plugin
          path: |
            plugin/build/libs/asp-plugin-*.jar
            !plugin/build/libs/*-javadoc*.jar
            !plugin/build/libs/*-sources*.jar
          if-no-files-found: error

      - name: Upload Paperclip JAR
        uses: actions/upload-artifact@v4
        with:
          name: aspaper-paperclip
          path: aspaper-server/build/libs/*-paperclip-*.jar
          if-no-files-found: error

      - name: Upload Bundler JAR
        uses: actions/upload-artifact@v4
        with:
          name: aspaper-bundler
          path: aspaper-server/build/libs/*-bundler-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.jar" -exec cp {} release-files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
