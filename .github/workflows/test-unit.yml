name: Unit Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all unit tests
        run: |
          ./gradlew :api:test :core:test :importer:test --continue
          ./gradlew :loaders:file-loader:test :loaders:mysql-loader:test --continue
          ./gradlew :loaders:mongo-loader:test :loaders:redis-loader:test --continue
