name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Run API Tests
        run: ./gradlew :api:test :api:jacocoTestReport --parallel --build-cache --no-watch-fs --continue
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Run Core Tests
        run: ./gradlew :core:test :core:jacocoTestReport --parallel --build-cache --no-watch-fs --continue
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Run Plugin Tests
        run: ./gradlew :plugin:test :plugin:jacocoTestReport --parallel --build-cache --no-watch-fs --continue || true
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ github.run_number }}
          path: |
            **/build/reports/jacoco/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: |
            api/build/reports/jacoco/test/jacocoTestReport.xml,
            core/build/reports/jacoco/test/jacocoTestReport.xml,
            plugin/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-asp
          fail_ci_if_error: false
          verbose: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/build/test-results/**/*.xml
          check_name: Test Results
          comment_mode: off
