# Codecov Configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "0...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  unittests:
    paths:
      - api/
      - core/
      - plugin/
      - loaders/
      - importer/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: api
      name: API Module
      paths:
        - api/src/main/**
    - component_id: core
      name: Core Module
      paths:
        - core/src/main/**
    - component_id: plugin
      name: Plugin Module
      paths:
        - plugin/src/main/**
    - component_id: loaders
      name: Loaders
      paths:
        - loaders/**/src/main/**

ignore:
  - "**/*Test.java"
  - "**/test/**"
  - "**/build/**"
  - "buildSrc/**"
